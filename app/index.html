<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Подходы</title>
<meta name="description" content="Журнал тренировок и объём подходов по мышцам">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Подходы">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#EEF1F4" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0F151C" media="(prefers-color-scheme: dark)">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600&family=Unbounded:wght@500;700&display=swap">
<style>
/* Layout: one-column gym app. Sticky tabs; workout = day strip + exercise cards; progress = list -> detail with chart */
:root{
  --bg:#EEF1F4; --surface:#FFFFFF; --sunk:#E3E8ED; --line:#D3DAE1;
  --fg:#15202B; --muted:#5B6874; --faint:#8994A0;
  --acc:#2550C8; --acc-ink:#FFFFFF; --acc-soft:#A9BCF0;
  --m0:#D6DDE4; --body:#C4CDD6;
  --h1:#C9D6F6; --h2:#8DA8EC; --h3:#2F5BD3; --over:#E08A1E;
  --good:#1D8A4E; --good-soft:#D5F0E0; --bad:#C23A2B;
  --band:rgba(37,80,200,.12); --scrim:rgba(15,21,28,.45);
  --f-display:"Unbounded","Arial Black",system-ui,sans-serif;
  --f-body:"Golos Text",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --r:12px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0F151C; --surface:#18212B; --sunk:#121A22; --line:#2A3542;
  --fg:#E7ECF1; --muted:#9AA7B4; --faint:#6E7B88;
  --acc:#6F95FF; --acc-ink:#0B1220; --acc-soft:#34508F;
  --m0:#2A3644; --body:#212C38;
  --h1:#2A3E6B; --h2:#3E62B8; --h3:#7A9CFF; --over:#F0A040;
  --good:#4CC38A; --good-soft:#173A2A; --bad:#FF7A6B;
  --band:rgba(111,149,255,.14); --scrim:rgba(0,0,0,.6); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F151C; --surface:#18212B; --sunk:#121A22; --line:#2A3542;
  --fg:#E7ECF1; --muted:#9AA7B4; --faint:#6E7B88;
  --acc:#6F95FF; --acc-ink:#0B1220; --acc-soft:#34508F;
  --m0:#2A3644; --body:#212C38;
  --h1:#2A3E6B; --h2:#3E62B8; --h3:#7A9CFF; --over:#F0A040;
  --good:#4CC38A; --good-soft:#173A2A; --bad:#FF7A6B;
  --band:rgba(111,149,255,.14); --scrim:rgba(0,0,0,.6); color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.45;font-variant-numeric:tabular-nums}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.wrap{max-width:820px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px 120px}
header.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:10px}
h1{font-family:var(--f-display);font-weight:700;font-size:24px;letter-spacing:-.01em;margin:0}
.topbtns{display:flex;gap:6px}
nav.tabs{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);display:grid;grid-template-columns:repeat(4,1fr);gap:4px;padding-block:8px;border-bottom:1px solid var(--line);margin-bottom:16px}
nav.tabs button{border:0;background:transparent;color:var(--muted);font:600 13px var(--f-body);padding:9px 2px;border-radius:8px;cursor:pointer;white-space:nowrap}
nav.tabs button[aria-selected="true"]{background:var(--fg);color:var(--bg)}
button:focus-visible,input:focus-visible,select:focus-visible,label.btn:focus-within{outline:2px solid var(--acc);outline-offset:2px}
h2{font-family:var(--f-display);font-weight:500;font-size:17px;margin:0;text-wrap:balance}
h3{font-size:15px;font-weight:600;margin:0}
.label{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.stack{display:flex;flex-direction:column;gap:14px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.spread{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.muted{color:var(--muted)} .hint{font-size:13px;color:var(--muted)}
.btn,label.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);background:var(--surface);color:var(--fg);font:500 14px var(--f-body);padding:8px 14px;border-radius:9px;cursor:pointer;text-decoration:none}
.btn:hover{border-color:var(--faint)}
.btn:disabled{opacity:.45;cursor:default}
.btn.primary{background:var(--acc);color:var(--acc-ink);border-color:var(--acc);font-weight:600}
.btn.big{padding:12px 18px;font-size:15px}
.btn.ghost{border-color:transparent;background:transparent;color:var(--muted)}
.btn.danger{color:var(--bad)}
.btn.icon{width:36px;height:36px;padding:0}
.btn.small{padding:5px 10px;font-size:13px}
input,select{font:inherit;color:var(--fg);background:var(--sunk);border:1px solid var(--line);border-radius:8px;padding:8px 10px;min-width:0}
input::placeholder{color:var(--faint)}
.err{color:var(--bad);font-size:13px}
.chips{display:flex;flex-wrap:wrap;gap:5px}
.chip{font-size:12px;padding:2px 8px;border-radius:999px;background:var(--sunk);color:var(--muted);border:1px solid transparent}
.chip.p{background:var(--acc);color:var(--acc-ink)}
.chip.s{background:transparent;border-color:var(--acc-soft);color:var(--fg)}
.pill{font-size:12px;font-weight:600;padding:2px 8px;border-radius:999px;white-space:nowrap}
.pill.pr{background:var(--over);color:#1A1205}
.pill.up{background:var(--good-soft);color:var(--good)}
.pill.down{color:var(--bad);border:1px solid var(--line)}
.legend{display:flex;flex-wrap:wrap;gap:6px 12px;font-size:12px;color:var(--muted);justify-content:center}
.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;vertical-align:-2px;margin-right:5px}

/* body map */
svg.body{width:100%;height:auto;display:block;max-width:220px;margin:0 auto}
svg.body .mus{stroke:var(--surface);stroke-width:1;stroke-linejoin:round;transition:fill .2s}
svg.body.clickable .mus{cursor:pointer}
svg.body .mus.sel{stroke:var(--fg);stroke-width:1.8}
.mini{display:flex;gap:2px;flex:none}
.mini svg.body{width:34px;margin:0}

/* workout: day strip */
.strip{display:grid;grid-template-columns:36px repeat(7,minmax(0,1fr)) 36px;gap:4px;align-items:stretch}
.strip .nav{align-self:center}
.dayb{border:1px solid transparent;background:var(--surface);border-radius:10px;padding:6px 0 8px;cursor:pointer;color:var(--fg);font:inherit;display:flex;flex-direction:column;align-items:center;gap:1px;min-width:0}
.dayb small{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.dayb b{font-size:16px;font-weight:600}
.dayb i{width:6px;height:6px;border-radius:50%;background:transparent;margin-top:2px}
.dayb.has i{background:var(--acc)}
.dayb.today{border-color:var(--acc-soft)}
.dayb.on{background:var(--fg);color:var(--bg)} .dayb.on small{color:var(--bg);opacity:.75} .dayb.on.has i{background:var(--bg)}
.dayttl{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap}
.dayttl h2{font-size:19px}
.dayttl h2::first-letter{text-transform:uppercase}
.sumline{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--muted)}
.sumline b{color:var(--fg);font-weight:600}

/* workout: cards */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:10px}
.card .ch{display:flex;gap:10px;align-items:flex-start}
.card .ch .ttl{flex:1;min-width:0;display:flex;flex-direction:column;gap:5px}
.exname{all:unset;cursor:pointer;font-weight:600;font-size:16px;line-height:1.3}
.exname:hover{color:var(--acc)} .exname:focus-visible{outline:2px solid var(--acc);outline-offset:2px;border-radius:4px}
.meta{font-size:13px;color:var(--muted);display:flex;flex-direction:column;gap:4px}
.meta .last{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.meta .plan{color:var(--fg)}
.sgrid{display:grid;grid-template-columns:24px minmax(0,1fr) minmax(0,1fr) 44px 30px;gap:6px;align-items:center}
.sgrid.head{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.sgrid .n{color:var(--faint);font-size:13px;text-align:center}
.sgrid input{width:100%;text-align:center;font-size:16px;padding:9px 4px}
.sgrid.done input{background:var(--good-soft);border-color:transparent}
.tick{width:44px;height:40px;border-radius:9px;border:1px solid var(--line);background:var(--surface);color:var(--faint);cursor:pointer;display:grid;place-items:center}
.tick svg{width:18px;height:18px}
.sgrid.done .tick{background:var(--good);border-color:var(--good);color:var(--surface)}
.rm{width:30px;height:30px;border:0;background:transparent;color:var(--faint);cursor:pointer;border-radius:6px;font-size:18px}
.rm:hover:not(:disabled){color:var(--bad)} .rm:disabled{opacity:.3;cursor:default}
.cardfoot{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.cardfoot input{flex:1;min-width:140px;font-size:14px}
.confirmrow{display:flex;gap:6px;align-items:center;flex-wrap:wrap;font-size:14px;background:var(--sunk);border-radius:8px;padding:8px 10px}
.empty{text-align:center;padding:24px 16px}
.empty h2{margin-bottom:6px}
.tplgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px}
.tpl{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:8px}
.tpl ol{margin:0;padding-left:18px;font-size:13px;color:var(--muted)}
.tpl .acts{display:flex;gap:6px;align-items:center;margin-top:auto}
.addbar{display:flex;gap:8px;flex-wrap:wrap}
.addbar .btn.primary{flex:1;min-width:200px}
.daytools{display:flex;gap:6px;flex-wrap:wrap;align-items:center;border-top:1px solid var(--line);padding-top:12px}
.histlist{display:flex;flex-direction:column}
.hrow{all:unset;cursor:pointer;display:grid;grid-template-columns:110px minmax(0,1fr) auto;gap:10px;align-items:baseline;padding:10px 4px;border-bottom:1px solid var(--line)}
.hrow:hover{background:var(--band)}
.hrow:focus-visible{outline:2px solid var(--acc)}
.hrow b{font-weight:600}
.hrow span{font-size:13px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hrow em{font-style:normal;font-size:13px;color:var(--faint)}
@media (max-width:520px){.hrow{grid-template-columns:minmax(0,1fr) auto}.hrow span{grid-column:1/-1;grid-row:2}}

/* welcome */
.welcome{border:1px solid var(--acc-soft);background:linear-gradient(var(--band),var(--band)),var(--surface)}
.steps{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;counter-reset:s}
.steps div{counter-increment:s;font-size:14px;display:grid;grid-template-columns:26px 1fr;gap:8px;align-items:start}
.steps div::before{content:counter(s);width:24px;height:24px;border-radius:50%;background:var(--acc);color:var(--acc-ink);display:grid;place-items:center;font-size:12px;font-weight:700}

/* week */
.weeknav{display:flex;align-items:center;justify-content:space-between;gap:8px}
.weeknav .range{font-family:var(--f-display);font-weight:500;font-size:16px;text-align:center}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.stats div{background:var(--surface);padding:12px 14px;min-width:0}
.stats b{display:block;font-family:var(--f-display);font-weight:500;font-size:21px}
.stats small{font-size:12px;color:var(--faint)}
.weekgrid{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,6fr);gap:14px;align-items:start}
@media (max-width:720px){.weekgrid{grid-template-columns:minmax(0,1fr)}}
.maps{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.maps figure{margin:0;text-align:center}
.maps figcaption{font-size:11px;color:var(--faint);text-transform:uppercase;letter-spacing:.08em}
.hovername{min-height:20px;text-align:center;font-size:13px;color:var(--muted);margin-top:4px}
table.vol{width:100%;border-collapse:collapse}
table.vol td{padding:6px 0;border-bottom:1px solid var(--line);vertical-align:middle}
table.vol tr{cursor:pointer}
table.vol tr.g td{padding-top:12px;border-bottom-color:var(--faint)}
table.vol tr.g td.name{font-weight:600;font-size:14px}
table.vol tr.m td.name{padding-left:14px;font-size:13px;color:var(--muted)}
table.vol tr.m .bar{height:7px}
table.vol tr.sel td{background:var(--band)}
table.vol td.name{width:44%;padding-right:8px}
table.vol td.num{width:48px;text-align:right;font-weight:600;padding-left:8px}
table.vol tr.m td.num{font-weight:500;color:var(--muted)}
.bar{position:relative;height:12px;background:var(--sunk);border-radius:3px;overflow:hidden}
.bar .zone{position:absolute;top:0;bottom:0;background:var(--band);border-left:1px dashed var(--acc-soft);border-right:1px dashed var(--acc-soft)}
.bar .fill{position:absolute;left:0;top:0;bottom:0;border-radius:3px}
.detail{font-size:14px;background:var(--sunk);border-radius:8px;padding:10px 12px;margin-bottom:8px}
.detail ul{margin:6px 0 0;padding-left:18px}

/* progress */
.plist{display:flex;flex-direction:column;gap:8px}
.prow{all:unset;cursor:pointer;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;display:grid;grid-template-columns:minmax(0,1fr) 110px auto;gap:12px;align-items:center}
.prow:hover{border-color:var(--faint)} .prow:focus-visible{outline:2px solid var(--acc)}
.prow .nm{font-weight:600}
.prow .sub{font-size:13px;color:var(--muted)}
.prow .val{text-align:right;font-weight:600;white-space:nowrap}
.prow .val small{display:block;font-weight:400;margin-top:2px}
@media (max-width:460px){.prow{grid-template-columns:minmax(0,1fr) auto}.prow svg{display:none}}
svg.spark{width:110px;height:34px;display:block}
.prtiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
@media (max-width:560px){.prtiles{grid-template-columns:repeat(2,minmax(0,1fr))}}
.prtiles div{background:var(--surface);padding:12px 14px;min-width:0}
.prtiles b{display:block;font-family:var(--f-display);font-weight:500;font-size:19px;margin-top:2px}
.prtiles small{font-size:12px;color:var(--faint)}
.seg{display:inline-flex;background:var(--sunk);border-radius:9px;padding:3px;gap:2px;flex-wrap:wrap}
.seg button{border:0;background:transparent;color:var(--muted);font:500 13px var(--f-body);padding:6px 10px;border-radius:7px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--fg);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.chartbox{overflow-x:auto}
svg.chart{width:100%;height:auto;display:block}
svg.chart text{fill:var(--muted);font:12px var(--f-body)}
.chartread{min-height:20px}
.tablewrap{overflow-x:auto}
table.sess{width:100%;border-collapse:collapse;font-size:14px}
table.sess th{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600;text-align:left;padding:6px 8px;border-bottom:2px solid var(--fg);white-space:nowrap}
table.sess td{padding:8px;border-bottom:1px solid var(--line);vertical-align:top}
table.sess td.r,table.sess th.r{text-align:right;white-space:nowrap}
table.sess tbody tr{cursor:pointer} table.sess tbody tr:hover{background:var(--band)}
table.sess td.sets{color:var(--muted);min-width:160px}

/* library */
.libtools{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.libtools input{flex:1;min-width:160px}
.libgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px}
.excard{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px;display:grid;grid-template-columns:72px minmax(0,1fr);gap:12px;align-items:center}
.excard .t{font-weight:600;margin-bottom:6px}
.excard .acts{margin-top:8px;display:flex;gap:4px;flex-wrap:wrap}
.group-title{margin:16px 0 8px}
.chipgroup{display:grid;grid-template-columns:110px minmax(0,1fr);gap:8px;align-items:start;padding-block:6px;border-bottom:1px solid var(--line)}
@media (max-width:560px){.chipgroup{grid-template-columns:minmax(0,1fr)}}
.chipgroup>span{font-size:13px;color:var(--muted);padding-top:6px}
button.chip{cursor:pointer;font:500 13px var(--f-body);padding:6px 11px}
.preview{display:flex;gap:14px;align-items:center}
.preview svg.body{width:64px;margin:0;flex:none}

/* sheets */
.scrim{position:fixed;inset:0;background:var(--scrim);z-index:30;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:640px;max-height:88vh;border-radius:16px 16px 0 0;display:flex;flex-direction:column;padding-bottom:env(safe-area-inset-bottom,0px)}
@media (min-width:700px){.scrim{align-items:center}.sheet{border-radius:16px;max-height:82vh}}
.sheet .sh{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:14px max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px));border-bottom:1px solid var(--line)}
.sheet .sb{overflow-y:auto;padding:12px max(16px,env(safe-area-inset-right,0px)) 20px max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:12px}
.pick{all:unset;cursor:pointer;display:grid;grid-template-columns:72px minmax(0,1fr);gap:10px;align-items:center;padding:8px;border-radius:10px;background:var(--surface);border:1px solid var(--line)}
.pick:hover{border-color:var(--acc-soft)} .pick:focus-visible{outline:2px solid var(--acc)}
.pick b{font-weight:600;display:block;margin-bottom:3px}
.pick .sub{font-size:12px;color:var(--muted)}
.picklist{display:flex;flex-direction:column;gap:6px}
.help p{margin:0}
.help ol{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px}

/* rest timer */
.rest{position:fixed;left:0;right:0;bottom:0;z-index:25;background:var(--fg);color:var(--bg);padding:10px max(16px,env(safe-area-inset-right,0px)) calc(10px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.rest .in{max-width:820px;margin:0 auto;display:flex;align-items:center;gap:10px}
.rest .time{font-family:var(--f-display);font-size:22px;font-weight:500;min-width:72px}
.rest .lbl{flex:1;font-size:13px;opacity:.8;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rest button{background:transparent;color:var(--bg);border:1px solid currentColor;border-radius:8px;padding:6px 10px;font:500 13px var(--f-body);cursor:pointer;opacity:.9}
.rest .prog{position:absolute;left:0;top:0;height:3px;background:var(--acc)}
.rest.doneT{background:var(--good)}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:9px;font-size:14px;z-index:40;max-width:calc(100% - 32px);box-shadow:0 4px 16px rgba(0,0,0,.2)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>

<div class="wrap">
  <header class="top">
    <h1>Подходы</h1>
    <div class="topbtns">
      <button class="btn small" id="openHelp">Как пользоваться</button>
      <button class="btn small" id="openData">Данные</button>
    </div>
  </header>

  <nav class="tabs" role="tablist">
    <button role="tab" id="tab-train" aria-selected="true" data-tab="train">Тренировка</button>

function localStore(){
  let data={};try{data=JSON.parse(localStorage.getItem(LS_KEY)||"{}")||{}}catch(e){}
  const save=()=>{try{localStorage.setItem(LS_KEY,JSON.stringify(data))}catch(e){toast("Не получилось сохранить: память браузера недоступна")}};
  return{mode:"local",start(cb){for(const k in data)docs.set(k,data[k]);cb()},
    async set(id,body){data[id]=body;save()},
    async del(id){delete data[id];save()}};
}
function dbStore(db,u){
  const col=db.collection("data/users/"+u);
  return{mode:"db",start(cb){col.onSnapshot(snap=>{
      const keep=new Map();for(const id of [...Object.keys(timers),...inflight])if(docs.has(id))keep.set(id,docs.get(id));
      docs.clear();for(const d of snap.docs)if(!deleting.has(d.id))docs.set(d.id,d.data());
      for(const [k,v] of keep)docs.set(k,v);cb()},()=>toast("Нет связи с хранилищем, изменения могут не сохраниться"))},
    async set(id,body){await col.doc(id).set(body)},
    async del(id){await col.doc(id).delete()}};
}
function errToast(e){toast(e&&e.code==="quota_exceeded"?"Хранилище заполнено. Удали старые записи.":"Не получилось сохранить. Проверь соединение.")}
function clean(b){return JSON.parse(JSON.stringify(b))}
function put(id,body,delay=0){
  docs.set(id,body);clearTimeout(timers[id]);
  if(delay){timers[id]=setTimeout(()=>flush(id),delay);return Promise.resolve()}
  return flush(id);
}
function flush(id){
  clearTimeout(timers[id]);delete timers[id];
  inflight.add(id);
  chains[id]=(chains[id]||Promise.resolve()).then(()=>{const b=docs.get(id);return b?store.set(id,clean(b)):null}).catch(errToast).finally(()=>inflight.delete(id));
  return chains[id];
}
function flushAll(){return Promise.all(Object.keys(timers).map(flush))}
async function remove(id){
  clearTimeout(timers[id]);delete timers[id];docs.delete(id);deleting.add(id);
  try{await (chains[id]||Promise.resolve());await store.del(id)}catch(e){errToast(e)}finally{deleting.delete(id)}
}
document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="hidden")flushAll()});
window.addEventListener("pagehide",()=>flushAll());

async function boot(){
  let db=null,user=null,u=null;
  try{if(window.claude&&window.claude.use){[db,user]=await Promise.all([window.claude.use("db"),window.claude.use("user")]);if(user)u=await user.id()}}catch(e){}
  store=(db&&u)?dbStore(db,u):localStore();
  let first=true;
  store.start(()=>{ready=true;if(first){first=false;seed()}render()});
}
async function seed(){
  if(docs.has("meta_tplseed"))return;
  for(let i=0;i<DEFAULT_TPL.length;i++){const [id,name,items]=DEFAULT_TPL[i];
    if(!docs.has(id))await put(id,{kind:"tpl",name,o:i,items:items.map(([ex,n,reps,rest])=>({ex,n,reps,rest}))})}
  await put("meta_tplseed",{kind:"meta",done:true});
  render();
}

/* ================= analytics ================= */
function sessionsFor(exId){
  const by={};
  for(const e of entries()){if(e.ex!==exId)continue;const d=doneSets(e.sets);if(!d.length)continue;(by[e.date]=by[e.date]||[]).push(...d.map(s=>({r:+s.r,w:+s.w||0})))}
  return Object.keys(by).sort().map(date=>{const sets=by[date];
    const best=sets.reduce((b,s)=>e1rm(s.w,s.r)>e1rm(b.w,b.r)?s:b,sets[0]);
    return{date,sets,top:Math.max(...sets.map(s=>s.w)),maxReps:Math.max(...sets.map(s=>s.r)),e1rm:Math.max(...sets.map(s=>e1rm(s.w,s.r))),vol:sets.reduce((t,s)=>t+s.w*s.r,0),totalReps:sets.reduce((t,s)=>t+s.r,0),best}});
}
const METRICS={
  e1rm:{name:"Расчётный 1ПМ",unit:"кг",get:s=>s.e1rm,hint:"Вес, который ты, скорее всего, поднял бы на 1 раз. Считается по лучшему подходу: вес × (1 + повторы / 30). Растёт и когда добавляешь вес, и когда добавляешь повторы."},
  top:{name:"Макс. вес",unit:"кг",get:s=>s.top,hint:"Самый тяжёлый рабочий вес за тренировку."},
  vol:{name:"Объём",unit:"кг",get:s=>s.vol,hint:"Сумма вес × повторы за все подходы упражнения."},
  reps:{name:"Повторы",unit:"",get:s=>s.totalReps,hint:"Сумма повторений за тренировку. Главный показатель для упражнений без веса."}
};
const autoMetric=sess=>sess.some(s=>s.top>0)?"e1rm":"reps";
const fmtMetric=(k,v)=>nf.format(Math.round(v*10)/10)+(METRICS[k].unit?" "+METRICS[k].unit:"");
function bestBefore(exId,date,excludeId){
  let b=0;for(const e of entries()){if(e.ex!==exId||e.id===excludeId||e.date>=date)continue;for(const s of doneSets(e.sets))b=Math.max(b,e1rm(+s.w||0,+s.r))}return b;
}
function lastSession(exId,beforeDate,excludeId){
  return entries().filter(e=>e.ex===exId&&e.id!==excludeId&&e.date<beforeDate&&doneSets(e.sets).length).sort((a,b)=>(b.date+(b.t||"")).localeCompare(a.date+(a.t||"")))[0];
}

/* ================= TRAIN view ================= */
function dayEntries(d){return entries().filter(e=>e.date===d).sort((a,b)=>(a.o??0)-(b.o??0)||(a.t||"").localeCompare(b.t||""))}
function workoutDays(){const m={};for(const e of entries())(m[e.date]=m[e.date]||[]).push(e);return m}
function trainFocused(){const a=document.activeElement;return !!(a&&a.matches&&a.matches("#view-train input"))}
let trainPending=false;const typedAt={};
function renderTrain(force){
  if(!force&&trainFocused()){trainPending=true;return}
  trainPending=false;
  const v=$("view-train");if(!S.day)S.day=today();
  const days=workoutDays();const ws=mondayOf(parseISO(S.day));
  let h="";
  if(lsGet("podhody.welcome")!=="off"&&entries().filter(e=>!e.demo).length<4)h+=welcomeHTML();
  h+=`<div class="strip"><button class="btn icon nav" data-act="wk-prev" aria-label="Предыдущая неделя">‹</button>`;
  for(let i=0;i<7;i++){const d=addDays(ws,i),k=iso(d);
    h+=`<button class="dayb${days[k]?' has':''}${k===today()?' today':''}${k===S.day?' on':''}" data-day="${k}" aria-label="${fDM.format(d)}${days[k]?", есть тренировка":""}"><small>${wds(d)}</small><b>${d.getDate()}</b><i></i></button>`}
  h+=`<button class="btn icon nav" data-act="wk-next" aria-label="Следующая неделя">›</button></div>`;
  const list=dayEntries(S.day);
  const nSets=list.reduce((t,e)=>t+doneSets(e.sets).length,0),total=list.reduce((t,e)=>t+(e.sets||[]).length,0),ton=list.reduce((t,e)=>t+tonnage(e.sets),0);
  h+=`<div class="dayttl"><h2>${esc(dayTitle(S.day))}</h2>${S.day!==today()?`<button class="btn small" data-act="go-today">К сегодняшнему дню</button>`:""}</div>`;
  if(list.length){
    h+=`<div class="sumline"><span><b>${list.length}</b> ${exLabel(list.length)}</span><span><b>${nSets}</b> из ${total} ${setsLabel(total)} отмечено</span>${ton?`<span><b>${nf.format(Math.round(ton))}</b> кг тоннаж</span>`:""}</div>`;
    h+=list.map(cardHTML).join("");
    h+=`<div class="addbar"><button class="btn primary big" data-act="add-ex">+ Добавить упражнение</button></div>`;
    h+=dayToolsHTML(list);
  }else{
    h+=`<div class="panel empty"><h2>${S.day>today()?"На этот день ничего не запланировано":"В этот день тренировки нет"}</h2><p class="muted" style="margin:0 auto 12px;max-width:46ch">Начни по шаблону: все упражнения появятся сразу, останется вписать вес и повторы. Или добавляй упражнения по одному.</p><button class="btn primary big" data-act="add-ex">+ Добавить упражнение</button></div>`;
    const tp=templates();
    if(tp.length)h+=`<div class="spread"><h2>Шаблоны</h2><span class="hint">веса подскажет прошлый раз</span></div><div class="tplgrid">${tp.map(tplHTML).join("")}</div>`;
  }
  h+=historyHTML(days);
  v.innerHTML=h;
}
function welcomeHTML(){return `<div class="panel welcome stack"><div class="spread"><h2>Как это работает</h2><button class="btn ghost small" data-act="welcome-off">Понятно, скрыть</button></div>
  <div class="steps"><div><span>Выбери день в полоске и нажми шаблон или «Добавить упражнение».</span></div><div><span>Впиши вес и повторы. Серые цифры — прошлый раз: нажми галочку, и они подставятся.</span></div><div><span>Сохранять не нужно, всё пишется само. Любой прошлый день можно открыть и поправить.</span></div><div><span>«Неделя» — нагрузка на мышцы. «Прогресс» — графики и рекорды по упражнениям.</span></div></div></div>`}
function tplHTML(t){
  const items=t.items||[];
  return `<div class="tpl"><h3>${esc(t.name)}</h3><ol>${items.map(it=>{const ex=exById(it.ex);return `<li>${esc(ex?ex.name:"?")} — ${it.n}×${esc(it.reps||"")}</li>`}).join("")}</ol>
  ${S.confirm==="tpl:"+t.id?`<div class="confirmrow">Удалить шаблон? <button class="btn small danger" data-act="tpl-del-ok" data-id="${t.id}">Удалить</button><button class="btn small ghost" data-act="cancel">Нет</button></div>`:
  `<div class="acts"><button class="btn primary" data-act="tpl-start" data-id="${t.id}">Начать</button><button class="btn ghost small" data-act="tpl-del" data-id="${t.id}">Удалить</button></div>`}</div>`;
}
function cardHTML(e){
  const ex=exById(e.ex);const sets=e.sets&&e.sets.length?e.sets:[{r:null,w:null}];
  const last=lastSession(e.ex,e.date,e.id);const lastD=last?doneSets(last.sets):[];
  const best=bestBefore(e.ex,e.date,e.id);
  const myBest=Math.max(0,...doneSets(e.sets).map(s=>e1rm(+s.w||0,+s.r)));
  const isPR=best>0&&myBest>best+0.01;
  const planReps=e.plan&&e.plan.reps?(String(e.plan.reps).match(/\d+/)||[])[0]:null;
  let h=`<article class="card" data-id="${e.id}"><div class="ch">${miniMaps(ex)}<div class="ttl">
    <div class="spread" style="align-items:flex-start;flex-wrap:nowrap"><button class="exname" data-act="prog" data-ex="${esc(e.ex)}" title="Открыть прогресс">${esc(ex?ex.name:"Удалённое упражнение")}</button><span class="row" style="gap:4px;flex-wrap:nowrap">${isPR?`<span class="pill pr">Рекорд</span>`:""}${e.demo?`<span class="pill down">пример</span>`:""}</span></div>
    <div class="meta">${e.plan&&e.plan.reps?`<span class="plan">План: ${e.sets.length}×${esc(e.plan.reps)}${e.plan.rest?` · отдых ${fmtRest(e.plan.rest)}`:""}</span>`:""}
    ${last?`<span class="last"><span>Прошлый раз, ${fDMs.format(parseISO(last.date))}: ${esc(setsText(last.sets))}</span><button class="btn small" data-act="copy-last">Подставить веса</button></span>`:`<span>Первый раз это упражнение: впиши рабочий вес и повторы.</span>`}</div></div></div>
    <div class="sgrid head"><span>№</span><span>Вес, кг</span><span>Повторы</span><span></span><span></span></div>`;
  sets.forEach((s,i)=>{const p=lastD[i]||lastD[lastD.length-1];const done=+s.r>0;
    h+=`<div class="sgrid${done?' done':''}" data-i="${i}"><span class="n">${i+1}</span>
      <input id="w-${e.id}-${i}" data-f="w" inputmode="decimal" autocomplete="off" value="${inNum(s.w)}" placeholder="${p&&+p.w?esc(inNum(p.w)):"кг"}" aria-label="Вес, подход ${i+1}">
      <input id="r-${e.id}-${i}" data-f="r" inputmode="numeric" autocomplete="off" value="${inNum(s.r)}" placeholder="${p?esc(p.r):planReps||"повт"}" aria-label="Повторы, подход ${i+1}">
      <button class="tick" data-act="tick" aria-label="${done?"Снять отметку с подхода":"Отметить подход"} ${i+1}" title="${done?"Снять отметку":"Подход сделан. Пустые поля возьмут серые цифры"}">${CHECK}</button>
      <button class="rm" data-act="rm-set" aria-label="Убрать подход ${i+1}" ${sets.length<2?"disabled":""}>×</button></div>`});
  h+=`<div class="cardfoot"><button class="btn small" data-act="add-set">+ Подход</button><input id="note-${e.id}" data-f="note" maxlength="200" value="${esc(e.note||"")}" placeholder="Заметка: самочувствие, техника…" aria-label="Заметка">
    ${S.confirm==="ex:"+e.id?`<div class="confirmrow" style="width:100%">Убрать «${esc(ex?ex.name:"")}» из тренировки? <button class="btn small danger" data-act="del-ex-ok">Убрать</button><button class="btn small ghost" data-act="cancel">Нет</button></div>`:`<button class="btn small ghost danger" data-act="del-ex">Убрать упражнение</button>`}</div></article>`;
  return h;
}
function dayToolsHTML(list){
  if(S.confirm==="day")return `<div class="confirmrow">Удалить всю тренировку (${list.length} ${exLabel(list.length)})? Вернуть её не получится. <button class="btn small danger" data-act="day-del-ok">Удалить</button><button class="btn small ghost" data-act="cancel">Нет</button></div>`;
  if(S.tplName!=null)return `<div class="confirmrow"><input id="tplNameIn" value="${esc(S.tplName)}" style="flex:1;min-width:160px" aria-label="Название шаблона"><button class="btn small primary" data-act="tpl-save-ok">Сохранить шаблон</button><button class="btn small ghost" data-act="cancel">Отмена</button></div>`;
  if(S.confirm==="move")return `<div class="confirmrow">Перенести на дату: <input type="date" id="moveDate" value="${S.day}"><button class="btn small primary" data-act="move-ok">Перенести</button><button class="btn small ghost" data-act="cancel">Отмена</button></div>`;
  return `<div class="daytools"><button class="btn small" data-act="tpl-save">Сохранить как шаблон</button><button class="btn small" data-act="move">Перенести на другой день</button><button class="btn small ghost danger" data-act="day-del">Удалить тренировку</button></div>`;
}
function historyHTML(days){
  const ks=Object.keys(days).filter(k=>k!==S.day).sort().reverse();
  if(!ks.length)return "";
  const show=S.histMore?ks:ks.slice(0,8);
  return `<div><div class="spread" style="margin-top:8px"><h2>Все тренировки</h2><span class="hint">нажми, чтобы открыть и поправить</span></div><div class="histlist">${show.map(k=>{
    const es=days[k].slice().sort((a,b)=>(a.o??0)-(b.o??0));const n=es.reduce((t,e)=>t+doneSets(e.sets).length,0);
    return `<button class="hrow" data-day="${k}"><b>${esc(wds(parseISO(k)))}, ${fDMs.format(parseISO(k))}</b><span>${esc(es.map(e=>(exById(e.ex)||{}).name||"?").join(", "))}</span><em>${n} ${setsLabel(n)}</em></button>`}).join("")}</div>
    ${ks.length>8&&!S.histMore?`<button class="btn ghost" data-act="hist-more" style="margin-top:6px">Показать все (${ks.length})</button>`:""}</div>`;
}

/* train actions */
function newEntry(exId,extra={}){
  const list=dayEntries(S.day);const last=lastSession(exId,S.day);
  const n=extra.n||(last?doneSets(last.sets).length:3);
  const body={kind:"log",date:S.day,ex:exId,sets:Array.from({length:Math.max(1,Math.min(n,12))},()=>({r:null,w:null})),t:new Date().toISOString(),o:(list.length?Math.max(...list.map(e=>e.o??0))+1:0)};
  if(extra.plan)body.plan=extra.plan;
  return body;
}
const entryBody=id=>{const d=docs.get(id);return d?clean(d):null};
$("view-train").addEventListener("click",async ev=>{
  const t=ev.target.closest("[data-act],[data-day]");if(!t)return;
  const card=t.closest(".card"),id=card&&card.dataset.id;
  if(t.dataset.day&&!t.dataset.act){await flushAll();S.day=t.dataset.day;S.confirm=null;S.tplName=null;renderTrain(true);if(t.classList.contains("hrow"))window.scrollTo({top:0,behavior:"smooth"});return}
  switch(t.dataset.act){
    case "wk-prev":S.day=iso(addDays(parseISO(S.day),-7));S.confirm=null;break;
    case "wk-next":S.day=iso(addDays(parseISO(S.day),7));S.confirm=null;break;
    case "go-today":S.day=today();S.confirm=null;break;
    case "welcome-off":lsSet("podhody.welcome","off");break;
    case "hist-more":S.histMore=true;break;
    case "add-ex":openPicker();return;
    case "prog":await flushAll();S.tab="prog";S.prog=t.dataset.ex;S.metric="auto";render();window.scrollTo(0,0);return;
    case "cancel":S.confirm=null;S.tplName=null;break;
    case "tpl-start":{const tp=docs.get(t.dataset.id);if(!tp)return;let o=0;
      for(const it of tp.items||[]){if(!exById(it.ex))continue;const b=newEntry(it.ex,{n:it.n,plan:{reps:it.reps||"",rest:it.rest||90}});b.o=o++;b.t=new Date(Date.now()+o).toISOString();await put(uid("w_"),b)}
      toast("Тренировка создана: "+tp.name);break}
    case "tpl-del":S.confirm="tpl:"+t.dataset.id;break;
    case "tpl-del-ok":await remove(t.dataset.id);S.confirm=null;toast("Шаблон удалён");break;
    case "tick":{const b=entryBody(id);const row=t.closest(".sgrid");const i=+row.dataset.i;
      while(b.sets.length<=i)b.sets.push({r:null,w:null});const s=b.sets[i];
      if(+s.r>0&&Date.now()-(typedAt[id+":"+i]||0)<5000){delete typedAt[id+":"+i];startRest(b);return}
      if(+s.r>0){s.r=null}else{
        const wi=row.querySelector('[data-f="w"]'),ri=row.querySelector('[data-f="r"]');
        const w=num(wi.value)??num(String(wi.placeholder).replace(/\s/g,"")),r=num(ri.value)??num(ri.placeholder);
        if(!r){ri.focus();toast("Впиши, сколько повторений сделал");return}
        s.w=w;s.r=Math.round(r);startRest(b)}
      await put(id,b);break}
    case "rm-set":{const b=entryBody(id);if(b.sets.length<2)return;b.sets.splice(+t.closest(".sgrid").dataset.i,1);await put(id,b);break}
    case "add-set":{const b=entryBody(id);const lastS=b.sets[b.sets.length-1];b.sets.push({r:null,w:lastS&&+lastS.w>0?lastS.w:null});await put(id,b);break}
    case "copy-last":{const b=entryBody(id);const last=lastSession(b.ex,b.date,id);if(!last)return;
      const ls=doneSets(last.sets);b.sets=ls.map((s,i)=>{const cur=b.sets[i];return cur&&+cur.r>0?cur:{w:+s.w||null,r:null}});
      toast("Веса из прошлого раза подставлены. Делай подход и жми галочку");await put(id,b);break}
    case "del-ex":S.confirm="ex:"+id;break;
    case "del-ex-ok":await remove(id);S.confirm=null;toast("Упражнение убрано из тренировки");break;
    case "day-del":S.confirm="day";break;
    case "day-del-ok":{for(const e of dayEntries(S.day))await remove(e.id);S.confirm=null;toast("Тренировка удалена");break}
    case "move":S.confirm="move";break;
    case "move-ok":{const nd=$("moveDate").value;if(!nd||nd===S.day){S.confirm=null;break}
      const off=dayEntries(nd).length;for(const e of dayEntries(S.day)){const b=entryBody(e.id);b.date=nd;b.o=(b.o??0)+off;await put(e.id,b)}
      S.day=nd;S.confirm=null;toast("Тренировка перенесена на "+fDM.format(parseISO(nd)));break}
    case "tpl-save":S.tplName="Моя тренировка, "+fDMs.format(parseISO(S.day));break;
    case "tpl-save-ok":{const name=($("tplNameIn").value||"").trim();if(!name){toast("Дай шаблону название");return}
      const items=dayEntries(S.day).map(e=>({ex:e.ex,n:Math.max(1,(e.sets||[]).length),reps:(e.plan&&e.plan.reps)||"",rest:(e.plan&&e.plan.rest)||90}));
      await put(uid("tpl_"),{kind:"tpl",name,o:templates().length,items});S.tplName=null;toast("Шаблон сохранён. Он появится на пустом дне");break}
    default:return;
  }
  renderTrain(true);
});
$("view-train").addEventListener("input",ev=>{
  const f=ev.target.dataset.f;if(!f)return;const card=ev.target.closest(".card");if(!card)return;
  const id=card.dataset.id;const b=entryBody(id);if(!b)return;
  if(f==="note"){const v=ev.target.value.trim();if(v)b.note=v;else delete b.note}
  else{const row=ev.target.closest(".sgrid");const i=+row.dataset.i;while(b.sets.length<=i)b.sets.push({r:null,w:null});
    const v=num(ev.target.value);b.sets[i][f]=f==="r"&&v!=null?Math.round(v):v;typedAt[id+":"+i]=Date.now();
    row.classList.toggle("done",+b.sets[i].r>0)}
  put(id,b,700);
});
$("view-train").addEventListener("change",ev=>{
  if(ev.target.dataset.f!=="r")return;const card=ev.target.closest(".card");if(!card)return;
  const b=docs.get(card.dataset.id);if(b&&num(ev.target.value)>0&&restEnd<Date.now())startRest(b);
});
$("view-train").addEventListener("focusout",()=>setTimeout(()=>{if(trainPending&&!trainFocused())renderTrain()},0));
$("view-train").addEventListener("keydown",ev=>{

function weekVolume(start){
  const a=iso(start),b=iso(addDays(start,6));
  const vol={},src={},gvol={},gsrc={};let sets=0,ton=0;const days=new Set();
  for(const [k] of MUSCLES){vol[k]=0;src[k]=[]}
  for(const g of GROUPS){gvol[g[0]]=0;gsrc[g[0]]=[]}
  for(const e of entries()){
    if(e.date<a||e.date>b)continue;const ex=exById(e.ex);if(!ex)continue;
    const n=doneSets(e.sets).length;if(!n)continue;sets+=n;ton+=tonnage(e.sets);days.add(e.date);
    for(const m of ex.p){vol[m]+=n;src[m].push([ex.name,n,1])}
    for(const m of ex.s){vol[m]+=n*.5;src[m].push([ex.name,n,.5])}
    for(const g of GROUPS){const mem=GMEM[g[0]];const k=ex.p.some(m=>mem.includes(m))?1:ex.s.some(m=>mem.includes(m))?.5:0;if(k){gvol[g[0]]+=n*k;gsrc[g[0]].push([ex.name,n,k])}}
  }
  return{vol,src,gvol,gsrc,sets,ton,days:days.size};
}

/* ================= PROGRESS view ================= */
function sparkSVG(vals){
  if(vals.length<2)return `<svg class="spark" viewBox="0 0 110 34" aria-hidden="true"><circle cx="55" cy="17" r="3" fill="var(--acc)"/></svg>`;
  const mn=Math.min(...vals),mx=Math.max(...vals),r=mx-mn||1;
  const pts=vals.map((v,i)=>[4+i*(102/(vals.length-1)),mx===mn?17:30-(v-mn)/r*24].map(n=>+n.toFixed(1)));
  return `<svg class="spark" viewBox="0 0 110 34" aria-hidden="true"><path d="M${pts.map(p=>p.join(",")).join("L")}L${pts[pts.length-1][0]},33L4,33Z" fill="var(--band)"/><polyline points="${pts.map(p=>p.join(",")).join(" ")}" fill="none" stroke="var(--acc)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><circle cx="${pts[pts.length-1][0]}" cy="${pts[pts.length-1][1]}" r="3" fill="var(--acc)"/></svg>`;
}
function niceTicks(mn,mx,n=4){if(mx===mn){mx=mn+1;mn=Math.max(0,mn-1)}const raw=(mx-mn)/n,mag=Math.pow(10,Math.floor(Math.log10(raw))),st=[1,2,2.5,5,10].map(x=>x*mag).find(x=>x>=raw);const a=Math.floor(mn/st)*st,b=Math.ceil(mx/st)*st;const t=[];for(let v=a;v<=b+1e-9;v+=st)t.push(Math.round(v*100)/100);return t}
function chartSVG(sess,k){
  const W=Math.round(Math.max(320,Math.min(760,($("view-prog").clientWidth||640)-34))),Hh=W<500?220:250,L=44,R=14,T=14,B=30;
  const vals=sess.map(s=>METRICS[k].get(s));const ticks=niceTicks(Math.min(...vals),Math.max(...vals));
  const y0=ticks[0],y1=ticks[ticks.length-1];
  const t0=parseISO(sess[0].date).getTime(),t1=parseISO(sess[sess.length-1].date).getTime();
  const X=s=>sess.length<2?(L+W-R)/2:L+8+(parseISO(s.date).getTime()-t0)/(t1-t0||1)*(W-L-R-16);
  const Y=v=>T+(1-(v-y0)/(y1-y0||1))*(Hh-T-B);
  let g=ticks.map(t=>`<line x1="${L}" x2="${W-R}" y1="${Y(t)}" y2="${Y(t)}" stroke="var(--line)" stroke-width="1"/><text x="${L-8}" y="${Y(t)+4}" text-anchor="end">${nf.format(t)}</text>`).join("");
  const pts=sess.map((s,i)=>[+X(s).toFixed(1),+Y(vals[i]).toFixed(1)]);
  const xl=[0,Math.floor((sess.length-1)/2),sess.length-1].filter((v,i,a)=>a.indexOf(v)===i);
  g+=xl.map(i=>`<text x="${pts[i][0]}" y="${Hh-8}" text-anchor="${sess.length<2?"middle":i===0?"start":i===sess.length-1?"end":"middle"}">${fDMs.format(parseISO(sess[i].date))}</text>`).join("");
  if(pts.length>1)g+=`<path d="M${pts.map(p=>p.join(",")).join("L")}L${pts[pts.length-1][0]},${Hh-B}L${pts[0][0]},${Hh-B}Z" fill="var(--band)"/><polyline points="${pts.map(p=>p.join(",")).join(" ")}" fill="none" stroke="var(--acc)" stroke-width="2.5" stroke-linejoin="round"/>`;
  const best=Math.max(...vals);
  g+=pts.map((p,i)=>`<circle cx="${p[0]}" cy="${p[1]}" r="${i===pts.length-1?6:4.5}" fill="${vals[i]===best?"var(--over)":"var(--acc)"}" stroke="var(--surface)" stroke-width="2" data-pt="${i}" style="cursor:pointer"><title>${fDM.format(parseISO(sess[i].date))}: ${fmtMetric(k,vals[i])} (${esc(setsText(sess[i].sets))})</title></circle>`).join("");
  return `<svg class="chart" viewBox="0 0 ${W} ${Hh}" role="img" aria-label="График: ${METRICS[k].name}">${g}</svg>`;
}

});
$("view-prog").addEventListener("input",e=>{if(e.target.id!=="progQ")return;S.progQ=e.target.value;
  renderProg();const i=$("progQ");i.focus();try{const n=i.value.length;i.setSelectionRange(n,n)}catch(_){}});

/* ================= LIBRARY ================= */
const groupOf=e=>e.builtin?GOF[e.p[0]]:"mine";
function groupedExercises(list){
  const groups={};for(const e of list){const g=groupOf(e);(groups[g]=groups[g]||[]).push(e)}
  return ["mine",...GROUPS.map(g=>g[0])].filter(g=>groups[g]).map(g=>[g==="mine"?"Мои упражнения":GNAME[g],groups[g].sort((a,b)=>a.name.localeCompare(b.name,"ru"))]);
}
const chipsFor=ex=>ex.p.map(m=>`<span class="chip p">${MNAME[m]}</span>`).join("")+ex.s.map(m=>`<span class="chip s">${MNAME[m]}</span>`).join("");
function renderLib(){
  const q=S.libQ.trim().toLowerCase();
  const match=e=>exMatch(e,q);
  const done=new Set(entries().filter(e=>doneSets(e.sets).length).map(e=>e.ex));
  const card=e=>`<div class="excard">${miniMaps(e)}<div style="min-width:0"><div class="t">${esc(e.name)}</div><div class="chips">${chipsFor(e)}</div><div class="acts"><button class="btn small" data-addtoday="${esc(e.id)}">В сегодняшнюю</button>${done.has(e.id)?`<button class="btn small" data-hist="${esc(e.id)}">Прогресс</button>`:""}${e.builtin?"":`<button class="btn small ghost" data-edit="${esc(e.id)}">Изменить</button><button class="btn small ghost danger" data-exdel="${esc(e.id)}">Удалить</button>`}</div></div></div>`;
  $("lib").innerHTML=groupedExercises(exercises().filter(match)).map(([g,l])=>`<h2 class="group-title">${esc(g)}</h2><div class="libgrid">${l.map(card).join("")}</div>`).join("")||`<p class="muted">Ничего не нашлось.</p>`;
}
function renderExForm(){
  const pick=S.exPick;
  $("exChips").innerHTML=GROUPS.map(([g,gn,ms])=>`<div class="chipgroup"><span>${gn}</span><div class="chips">${ms.map(([k,n])=>`<button type="button" class="chip ${pick[k]||""}" data-pick="${k}" aria-pressed="${!!pick[k]}">${n}${pick[k]==="p"?" · осн.":pick[k]==="s"?" · всп.":""}</button>`).join("")}</div></div>`).join("");
  const ex={p:Object.keys(pick).filter(k=>pick[k]==="p"),s:Object.keys(pick).filter(k=>pick[k]==="s")};
  $("exPreview").innerHTML=bodySVG("front",exFill(ex))+bodySVG("back",exFill(ex));
}
$("libSearch").addEventListener("input",e=>{S.libQ=e.target.value;renderLib()});
function openExForm(ex){
  S.exEdit=ex?ex.id:null;S.exPick={};
  if(ex){ex.p.forEach(m=>S.exPick[m]="p");ex.s.forEach(m=>S.exPick[m]="s")}
  $("exName").value=ex?ex.name:"";$("exFormTitle").textContent=ex?"Изменить упражнение":"Своё упражнение";
  $("exErr").hidden=true;$("exForm").hidden=false;renderExForm();$("exName").focus();
}
$("newEx").onclick=()=>openExForm(null);
$("exCancel").onclick=()=>{$("exForm").hidden=true};
$("exChips").addEventListener("click",e=>{const b=e.target.closest("[data-pick]");if(!b)return;const k=b.dataset.pick,v=S.exPick[k];if(!v)S.exPick[k]="p";else if(v==="p")S.exPick[k]="s";else delete S.exPick[k];renderExForm()});
$("exForm").addEventListener("submit",async e=>{
  e.preventDefault();
  const name=$("exName").value.trim(),p=Object.keys(S.exPick).filter(k=>S.exPick[k]==="p"),s=Object.keys(S.exPick).filter(k=>S.exPick[k]==="s");
  const err=$("exErr");
  if(!name){err.textContent="Дай упражнению название.";err.hidden=false;return}
  if(!p.length){err.textContent="Отметь хотя бы одну основную мышцу.";err.hidden=false;return}
  await put(S.exEdit||uid("x_"),{kind:"ex",name,p,s});toast(S.exEdit?"Упражнение обновлено":"Упражнение добавлено");$("exForm").hidden=true;render();
});
$("lib").addEventListener("click",async e=>{
  const ed=e.target.closest("[data-edit]"),del=e.target.closest("[data-exdel]"),hi=e.target.closest("[data-hist]"),ad=e.target.closest("[data-addtoday]");
  if(ed){openExForm(exById(ed.dataset.edit));window.scrollTo(0,0)}
  if(hi){S.prog=hi.dataset.hist;S.metric="auto";S.tab="prog";render();window.scrollTo(0,0)}
  if(ad){S.day=today();await put(uid("w_"),newEntry(ad.dataset.addtoday));S.tab="train";render();toast("Добавлено в сегодняшнюю тренировку");window.scrollTo(0,0)}
  if(del){if(del.dataset.armed){await remove(del.dataset.exdel);toast("Упражнение удалено");render()}else{del.dataset.armed="1";del.textContent="Точно удалить?"}}
});

/* ================= help & data ================= */
$("openHelp").onclick=()=>openSheet("Как пользоваться",`<div class="help stack">
  <h3>Записать тренировку</h3>
  <ol><li>Во вкладке «Тренировка» выбери день в полоске сверху. По умолчанию открыт сегодняшний.</li>
  <li>Нажми «Начать» у шаблона («День 1», «День 2», «День 3») или «Добавить упражнение».</li>
  <li>В строке подхода впиши вес и повторы. Серые цифры — что было в прошлый раз. Если сделал так же, просто нажми галочку: цифры подставятся, строка станет зелёной.</li>
  <li>После галочки внизу идёт таймер отдыха. «+30 с» добавляет время, «Готово» закрывает.</li></ol>
  <p class="hint">Кнопки «Сохранить» нет: всё записывается само. В статистику идут только подходы, где есть повторы.</p>
  <h3>Исправить или удалить</h3>
  <ol><li>Открой день в полоске или в списке «Все тренировки» внизу экрана.</li>
  <li>Цифры правятся прямо в строках. «×» убирает подход, «Убрать упражнение» — упражнение целиком.</li>
  <li>Под тренировкой: «Удалить тренировку», «Перенести на другой день», «Сохранить как шаблон».</li></ol>
  <h3>Смотреть прогресс</h3>
  <ol><li>«Прогресс» — список упражнений с мини-графиком и изменением к прошлому разу.</li>
  <li>Внутри: рекорды, график (расчётный 1ПМ, макс. вес, объём или повторы) и таблица всех тренировок.</li>
  <li>Название упражнения в тренировке тоже открывает его прогресс.</li></ol>
  <h3>Неделя</h3>
  <p>Схема тела и подходы на каждую мышцу за неделю. Основная мышца упражнения = 1 подход, вспомогательная = 0,5. Обычная зона для роста — 10–20 подходов на группу в неделю.</p>
  <button class="btn" id="helpWelcome">Вернуть подсказку на главный экран</button></div>`);
document.addEventListener("click",e=>{if(e.target.id==="helpWelcome"){lsSet("podhody.welcome","on");closeSheet();S.tab="train";render()}});

function backupData(){const out={};for(const [k,v] of docs)if(v&&(v.kind!=="meta"||k==="meta_import1"||k==="meta_tplseed"))out[k]=clean(v);return{app:"podhody",version:2,exported:new Date().toISOString(),docs:out}}
$("openData").onclick=()=>{
  const nE=entries().length,hasDemo=entries().some(e=>e.demo),showImp=!docs.has("meta_import1");
  const rest=+lsGet("podhody.rest")||90;
  const sh=openSheet("Данные",`<div class="stack">
    <p class="hint" style="margin:0">${store&&store.mode==="db"?"Записи хранятся в твоём аккаунте Claude и видны на всех устройствах.":"Записи хранятся на этом устройстве. Время от времени скачивай бэкап."} Сейчас записей: ${nE}.</p>
    <div class="panel stack"><h3>Бэкап</h3><p class="hint" style="margin:0">Файл со всеми тренировками, своими упражнениями и шаблонами. При загрузке новые записи добавятся, имеющиеся останутся как есть.</p>
      <div class="row"><button class="btn" id="exportBtn">Скачать бэкап</button><label class="btn" for="importFile" style="cursor:pointer">Загрузить из файла</label><input type="file" id="importFile" accept=".json,application/json" hidden></div></div>
    <div class="panel stack"><h3>Таймер отдыха</h3><p class="hint" style="margin:0">Сколько отдыхать, если в шаблоне не указано.</p>
      <div class="seg" role="group" aria-label="Отдых по умолчанию">${[60,90,120,180].map(s=>`<button data-rest="${s}" aria-pressed="${s===rest}">${fmtRest(s)}</button>`).join("")}</div></div>
    ${hasDemo?`<div class="panel spread"><span>Есть записи с пометкой «пример».</span><button class="btn danger" id="clearDemo">Удалить примеры</button></div>`:""}
    ${showImp?`<div class="panel stack"><h3>Тренировки из чата</h3><p class="hint" style="margin:0">Три дня, которые ты присылал в начале. Поставь даты и добавь.</p>
      ${IMPORT.map(d=>`<div class="row"><label class="label" for="imp-${d.key}" style="width:110px">${d.title}</label><input type="date" id="imp-${d.key}" value="${iso(addDays(new Date(),d.off))}"></div>`).join("")}
      <div class="row"><button class="btn primary" id="importGo">Добавить</button><button class="btn ghost" id="importHide">Не нужно</button></div></div>`:""}
  </div>`);
  sh.addEventListener("click",async e=>{
    const t=e.target;
    if(t.dataset.rest){lsSet("podhody.rest",t.dataset.rest);sh.querySelectorAll("[data-rest]").forEach(b=>b.setAttribute("aria-pressed",b===t));toast("Отдых по умолчанию: "+fmtRest(+t.dataset.rest))}
    if(t.id==="exportBtn")exportBackup();
    if(t.id==="clearDemo"){for(const x of entries().filter(x=>x.demo))await remove(x.id);toast("Примеры удалены");closeSheet();render()}
    if(t.id==="importHide"){await put("meta_import1",{kind:"meta",skipped:true});closeSheet()}
    if(t.id==="importGo"){t.disabled=true;let n=0;
      for(const d of IMPORT){const date=$("imp-"+d.key).value;if(!date)continue;
        d.items.forEach(([ex,sets,note],i)=>{const body={kind:"log",date,ex,sets:sets.map(([r,w])=>({r,w:w||null})),t:new Date(Date.now()+i).toISOString(),o:i};if(note)body.note=note;put(uid("w_"),body);n++})}
      await Promise.all(Object.values(chains));await put("meta_import1",{kind:"meta",done:true});toast("Добавлено записей: "+n);closeSheet();render()}
  });
  sh.addEventListener("change",async e=>{if(e.target.id!=="importFile")return;const f=e.target.files&&e.target.files[0];e.target.value="";if(f){await importBackup(f);closeSheet();render()}});
};
async function exportBackup(){
  await flushAll();
  const name="podhody-"+today()+".json",text=JSON.stringify(backupData(),null,1);
  let dl=null;try{if(window.claude&&window.claude.use)dl=await window.claude.use("downloads")}catch(e){}
  if(dl){try{const r=await dl.save({filename:name,data:text});if(r.status==="saved")toast("Бэкап сохранён")}catch(e){if(e&&e.code!=="declined")toast("Не получилось сохранить файл")}return}
  try{const url=URL.createObjectURL(new Blob([text],{type:"application/json"}));const a=document.createElement("a");a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),4000);toast("Бэкап сохранён")}catch(e){toast("Не получилось сохранить файл")}
}
async function importBackup(f){
  let data;try{data=JSON.parse(await f.text())}catch(_){toast("Не удалось прочитать файл бэкапа");return}
  if(!data||data.app!=="podhody"||typeof data.docs!=="object"){toast("Это не файл бэкапа трекера «Подходы»");return}
  let n=0,skip=0;
  for(const [id,body] of Object.entries(data.docs)){
    if(!/^[A-Za-z0-9_.~:@+-]{1,120}$/.test(id)||!body||typeof body!=="object"){skip++;continue}
    if(docs.has(id)){skip++;continue}
    if(body.kind==="log"&&!(Array.isArray(body.sets)&&/^\d{4}-\d\d-\d\d$/.test(body.date||""))){skip++;continue}
    put(id,body);n++;
  }
  await Promise.all(Object.values(chains));
  toast(n?"Загружено: "+n+(skip?", пропущено: "+skip:""):"Нового ничего нет, всё уже есть");
}

/* ================= render ================= */
function render(){
  for(const t of ["train","week","prog","lib"]){$("view-"+t).hidden=S.tab!==t;$("tab-"+t).setAttribute("aria-selected",S.tab===t)}
  if(!ready){$("view-train").innerHTML=`<div class="panel empty"><p class="muted" style="margin:0">Загружаю записи…</p></div>`;return}
  if(S.tab==="train")renderTrain();
  if(S.tab==="week")renderWeek();
  if(S.tab==="prog")renderProg();
  if(S.tab==="lib")renderLib();
}
document.querySelector("nav.tabs").addEventListener("click",async e=>{const b=e.target.closest("[data-tab]");if(!b)return;await flushAll();
  if(b.dataset.tab==="prog"&&S.tab==="prog")S.prog=null;
  if(b.dataset.tab==="week"&&S.tab!=="week")S.weekStart=mondayOf(S.day?parseISO(S.day):new Date());
  S.tab=b.dataset.tab;render();window.scrollTo(0,0)});

render();
boot();
})();
